image: Ubuntu1804 #образ для сборки
stack: node 12 #окружение
branches:
  only: 
    - main #ветка в git
cache: node_modules #кеширование
environment:
  matrix:
    - node_version: "18"

install:
  # 1. Ставим git (для unrs-resolver postinstall)
  - sudo apt-get update
  - sudo apt-get install -y git

  # 2. Ставим nvm и нужную версию Node
  - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  - export NVM_DIR="$HOME/.nvm"
  - [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
  - nvm install $env:node_version || nvm install 18

  # 3. Проверяем, что Node и npm есть
  - node -v
  - npm -v

  # 4. Устанавливаем зависимости с подробным логом (чтобы увидеть реальную ошибку unrs-resolver)
  - npm ci --verbose

build: off

test_script:
  - npm run test:ci