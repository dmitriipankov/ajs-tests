image: Ubuntu1804 #образ для сборки
stack: node 12 #окружение
branches:
  only: 
    - main #ветка в git
cache: node_modules #кеширование
environment:
  matrix:
    - node_version: "18"

install:
  # Для Linux-раннеров: ставим git через apt
  - sudo apt-get update
  - sudo apt-get install -y git
  # Ставим Node
  - ps: Install-Product node $env:node_version
  # Установка зависимостей с подробным логом
  - npm ci --verbose

build: off

test_script:
  - npm run test:ci